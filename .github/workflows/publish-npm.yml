name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.7.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-npm:
    name: Publish JavaScript Bindings to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Rust library
        run: cargo build --lib --release

      - name: Install JavaScript dependencies
        run: |
          cd bindings/javascript
          npm ci

      - name: Build NAPI bindings
        run: |
          cd bindings/javascript
          npm run build

      - name: Run tests
        run: |
          cd bindings/javascript
          npm test
        continue-on-error: true

      - name: Check package version
        id: check_version
        run: |
          cd bindings/javascript
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "Package version: $PACKAGE_VERSION"
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Publish to NPM
        run: |
          cd bindings/javascript
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release Comment
        uses: actions/github-script@v7
        if: github.event_name == 'release'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.release.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🎉 JavaScript bindings published to NPM: https://www.npmjs.com/package/@taciclei/magneto-serge/v/${{ steps.check_version.outputs.version }}'
            })

  publish-jest-plugin:
    name: Publish Jest Plugin to NPM
    runs-on: ubuntu-latest
    needs: publish-npm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: |
          cd bindings/javascript/packages/jest
          npm ci

      - name: Build Jest plugin
        run: |
          cd bindings/javascript/packages/jest
          npm run build

      - name: Run tests
        run: |
          cd bindings/javascript/packages/jest
          npm test
        continue-on-error: true

      - name: Publish Jest plugin to NPM
        run: |
          cd bindings/javascript/packages/jest
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
