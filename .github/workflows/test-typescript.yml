name: Test TypeScript Example

on:
  push:
    branches: [main, develop]
    paths:
      - 'examples/typescript-minimal/**'
      - 'bindings/javascript/**'
      - '.github/workflows/test-typescript.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'examples/typescript-minimal/**'
      - 'bindings/javascript/**'
      - '.github/workflows/test-typescript.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-typescript:
    name: Test TypeScript (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-node-${{ matrix.node }}

      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Build Rust library
        run: cargo build --lib --release

      - name: Build JavaScript bindings
        run: |
          cd bindings/javascript
          npm ci
          npm run build

      - name: Install TypeScript example dependencies
        run: |
          cd examples/typescript-minimal
          npm install

      - name: TypeScript type check
        run: |
          cd examples/typescript-minimal
          npm run type-check

      - name: Run tests (auto mode)
        run: |
          cd examples/typescript-minimal
          npm test
        env:
          MAGNETO_MODE: auto

      - name: Run tests (replay mode)
        run: |
          cd examples/typescript-minimal
          npm run test:replay
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node }}
          path: examples/typescript-minimal/coverage
          retention-days: 7

  test-typescript-coverage:
    name: TypeScript Code Coverage
    runs-on: ubuntu-latest
    needs: test-typescript

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Rust library
        run: cargo build --lib --release

      - name: Build JavaScript bindings
        run: |
          cd bindings/javascript
          npm ci
          npm run build

      - name: Install TypeScript example dependencies
        run: |
          cd examples/typescript-minimal
          npm install

      - name: Run tests with coverage
        run: |
          cd examples/typescript-minimal
          npm test -- --coverage
        env:
          MAGNETO_MODE: auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./examples/typescript-minimal/coverage/lcov.info
          flags: typescript
          name: typescript-example
          fail_ci_if_error: false
        continue-on-error: true

  validate-typescript-setup:
    name: Validate TypeScript Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check TypeScript configuration
        run: |
          cd examples/typescript-minimal
          cat tsconfig.json
          echo "✅ tsconfig.json is valid"

      - name: Check Jest configuration
        run: |
          cd examples/typescript-minimal
          cat jest.config.ts
          echo "✅ jest.config.ts is valid"

      - name: Check package.json
        run: |
          cd examples/typescript-minimal
          node -p "JSON.stringify(require('./package.json'), null, 2)"
          echo "✅ package.json is valid"

      - name: Verify README documentation
        run: |
          cd examples/typescript-minimal
          test -f README.md || (echo "❌ README.md is missing" && exit 1)
          echo "✅ README.md exists"
